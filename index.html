<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卒業おめでとう、アイサ！🌸</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+JP:wght@300;500;700&display=swap" rel="stylesheet">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --neon-pink: #FF69B4;
            --deep-crimson: #8B0000;
            --vibrant-purple: #BF40BF;
            --gold: #FFD700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Noto Sans JP', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        /* Magical Hellfire Sparks Animation */
        #embers-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Elegant Header */
        .header-container {
            z-index: 10;
            text-align: center;
            margin-bottom: 4rem;
            padding: 0 1rem;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.2rem, 8vw, 4.5rem);
            color: var(--neon-pink);
            text-shadow: 
                0 0 10px var(--neon-pink),
                0 0 20px var(--deep-crimson),
                0 0 30px var(--vibrant-purple);
            animation: pulse-glow 4s ease-in-out infinite;
            line-height: 1.2;
        }

        @keyframes pulse-glow {
            0%, 100% {
                text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--deep-crimson), 0 0 30px var(--vibrant-purple);
                transform: scale(1);
            }
            50% {
                text-shadow: 0 0 20px var(--neon-pink), 0 0 40px var(--deep-crimson), 0 0 60px var(--vibrant-purple);
                transform: scale(1.03);
            }
        }

        /* Luxury Pulsing Button */
        .button-container {
            z-index: 10;
        }

        .luxury-button {
            background: rgba(0, 0, 0, 0.6);
            border: 4px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 1.2rem 3rem;
            font-size: 1.5rem;
            font-weight: 700;
            border-radius: 100px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            letter-spacing: 0.1em;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.4);
            animation: button-pulse 2.5s ease-in-out infinite;
            outline: none;
        }

        .luxury-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 105, 180, 0.7);
            border-color: var(--vibrant-purple);
        }

        .luxury-button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -100%;
            width: 50%;
            height: 200%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s infinite linear;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        @keyframes button-pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 105, 180, 0.4); border-color: var(--neon-pink); }
            50% { box-shadow: 0 0 40px rgba(191, 64, 191, 0.6); border-color: var(--vibrant-purple); }
        }

        /* Glassmorphism Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.4s ease;
            padding: 1.5rem;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 2.5rem;
            padding: 3rem;
            max-width: 600px;
            width: 100%;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 100px rgba(255, 105, 180, 0.1);
            transform: translateY(30px) rotateX(10deg);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0) rotateX(0);
        }

        .close-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 2rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close-btn:hover { color: #fff; }

        .message-text {
            font-size: 1.25rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
            white-space: pre-wrap;
            letter-spacing: 0.05em;
        }

        .bottom-accent {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--neon-pink), transparent);
            opacity: 0.5;
        }

        .footer-detail {
            position: fixed;
            bottom: 2rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            color: rgba(255, 255, 255, 0.2);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="embers-canvas"></canvas>

    <div class="header-container">
        <h1>卒業おめでとう、アイサ！🌸</h1>
    </div>

    <div class="button-container">
        <button class="luxury-button" id="open-btn">メッセージを開く</button>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" id="close-btn">&times;</button>
            <p class="message-text">アイサ、高校卒業本当にお疲れ様！🌸
新しい門出を全力で応援してるよ。
また落ち着いたら、ハズビンの話したり一緒にゲームで暴れようね（笑）
アイサにとって最高の一日になりますように！(◠‿◕)</p>
            <div class="bottom-accent"></div>
        </div>
    </div>

    <div class="footer-detail">Exclusively for Aisa • 2026</div>

    <script>
        // --- Magical Hellfire Sparks Animation ---
        const canvas = document.getElementById('embers-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * 1.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 1;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.color = ['#FF69B4', '#8B0000', '#BF40BF'][Math.floor(Math.random() * 3)];
                this.life = 0;
                this.maxLife = Math.random() * 200 + 100;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                this.life++;
                if (this.y < -10 || this.life > this.maxLife) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity * (1 - this.life / this.maxLife);
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
        }

        function initParticles() {
            for (let i = 0; i < 60; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        initParticles();
        animate();

        // --- Interaction Logic ---
        const openBtn = document.getElementById('open-btn');
        const closeBtn = document.getElementById('close-btn');
        const modalOverlay = document.getElementById('modal-overlay');

        function triggerConfetti() {
            const colors = ['#FF69B4', '#FFD700', '#BF40BF'];
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#FFD700', '#FF69B4'],
                ticks: 200,
                gravity: 1.2,
                scalar: 1.2
            });
            // Side bursts
            confetti({ particleCount: 40, angle: 60, spread: 55, origin: { x: 0 }, colors: colors });
            confetti({ particleCount: 40, angle: 120, spread: 55, origin: { x: 1 }, colors: colors });
        }

        openBtn.addEventListener('click', () => {
            modalOverlay.classList.add('active');
            triggerConfetti();
        });

        closeBtn.addEventListener('click', () => modalOverlay.classList.remove('active'));
        modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) modalOverlay.classList.remove('active'); });
    </script>
</body>
</html>
